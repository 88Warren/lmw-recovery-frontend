server {
    listen 80;
    server_name lmwrecovery.co.uk www.lmwrecovery.co.uk;

    root  /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript;

    # ── Security headers ──────────────────────────────────────────────
    # HSTS is set at the TLS-terminating ingress in production, not here.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.googletagmanager.com https://*.google-analytics.com https://js.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com https://api.stripe.com; frame-src https://js.stripe.com https://hooks.stripe.com https://maps.google.com https://www.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    # Main site SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Redirect the bare .html form to the clean /admin URL.
    location = /admin.html {
        return 301 /admin;
    }

    # Admin panel — serve the admin bundle at the clean /admin (and /admin/) URL.
    location = /admin  { try_files /admin.html =404; }
    location = /admin/ { try_files /admin.html =404; }
    location /admin    { try_files $uri /admin.html; }

    # Cache hashed static assets forever
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        internal;
    }
}
