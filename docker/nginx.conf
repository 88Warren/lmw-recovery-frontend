events {}
http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  gzip          on;
  gzip_types    text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

  server {
    listen 80;
    server_name lmwrecovery.co.uk www.lmwrecovery.co.uk;

    root  /usr/share/nginx/html;
    index index.html;

    # Main site
    location / {
      try_files $uri $uri/ /index.html;
    }

    # Redirect the bare .html form to the clean /admin URL.
    location = /admin.html {
      return 301 /admin;
    }

    # Admin panel — serve the admin bundle at the clean /admin (and /admin/) URL.
    location = /admin  { try_files /admin.html =404; }
    location = /admin/ { try_files /admin.html =404; }
    location /admin    { try_files $uri /admin.html; }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
      expires 1y;
      add_header Cache-Control "public, immutable";
      access_log off;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
      root /usr/share/nginx/html;
      internal;
    }
  }
}
