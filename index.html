    <!-- ─── Structured data: FAQ (mirrors the on-page FAQ section) ───── -->

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What should I expect from my first sports massage?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Your first session starts with a short chat about your training, any niggles or injuries, and what you want from the treatment. You complete a brief health questionnaire beforehand so the work is safe and tailored to you. Whether you book a full sports massage or a shorter recovery express session, the work focuses on the areas that need it, and you stay in control of the pressure throughout."
          }
        },
        {
          "@type": "Question",
          "name": "Does deep tissue massage hurt?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Deep tissue massage can feel intense in tight or overworked muscles, but it should never be unbearable. Good sports massage therapy works with your body, not against it. I check in on pressure as we go and adjust to what feels productive for you rather than painful."
          }
        },
        {
          "@type": "Question",
          "name": "How often should I book a session?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "It depends on your training load. Many active clients book fortnightly for athlete recovery treatment that keeps tension in check, which is what the maintenance massage plan is built for. If you are working through a specific issue, weekly sessions for a short block can help; for general upkeep, monthly is plenty."
          }
        },
        {
          "@type": "Question",
          "name": "What should I wear?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Wear or bring comfortable, loose clothing such as shorts and a vest. You only need to expose the areas being treated, and you will always be draped with towels so you stay comfortable and covered throughout."
          }
        },
        {
          "@type": "Question",
          "name": "Where is the studio and is there parking?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The studio is a private, purpose-built space in Llantrisant, Rhondda Cynon Taf, with its own entrance separate from the house. There is free on-site parking, so you can arrive, park, and head straight in."
          }
        },
        {
          "@type": "Question",
          "name": "How do I book and pay?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "You can book online in a few taps using the \"Book a Session\" button. Choose your treatment and time, and pay securely via Stripe. You will get a confirmation email and a short health questionnaire to complete before your appointment."

        }
