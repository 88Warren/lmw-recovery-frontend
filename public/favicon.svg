<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="LMW Recovery">
  <!-- Dark rounded tile matching the site background -->
  <rect width="64" height="64" rx="12" fill="#0a0a0a"/>
  <!-- Thin gold inner frame -->
  <rect x="4.5" y="4.5" width="55" height="55" rx="9" fill="none" stroke="#C9A15B" stroke-opacity="0.4" stroke-width="1.5"/>
  <!-- LMW wordmark in brand gold, serif-inspired, bold for small-size legibility -->
  <text x="32" y="33"
        font-family="'Cormorant Garamond', Georgia, 'Times New Roman', serif"
        font-size="22" font-weight="700"
        letter-spacing="1.5"
        text-anchor="middle"
        fill="#C9A15B">LMW</text>
  <!-- RECOVERY micro-label -->
  <text x="32" y="46"
        font-family="'Montserrat', Arial, sans-serif"
        font-size="6.5" font-weight="700"
        letter-spacing="2.4"
        text-anchor="middle"
        fill="#F4F0EB">RECOVERY</text>
</svg>
