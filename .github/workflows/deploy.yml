name: Build & Deploy Frontend

# ── Trigger: push a version tag e.g. git tag v1.0.2 && git push origin v1.0.2
on:
  push:
    tags:
      - 'v*.*.*'

# ── Repo-specific config ─────────────────────────────────────────────────────
env:
  IMAGE_NAME:      lmwcode/lmw-recovery-frontend
  HELM_RELEASE:    lmwrecovery-frontend
  HELM_NAMESPACE:  lmw-recovery
  HELM_CHART_PATH: /opt/lmwrecovery/lmwrecovery-helmcharts/frontend
  HELM_IMAGE_KEY:  webserver.image.tag
  HEALTH_URL:      https://www.lmwrecovery.co.uk

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # JOB 1 — Quality checks (lint + build)
  # ────────────────────────────────────────────────────────────────────────────
  check:
    name: Lint & Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build verification
        run: npm run build

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 2 — Build image, scan, deploy (only if checks pass)
  # ────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Build → Scan → Push → Deploy
    runs-on: ubuntu-latest
    needs: check

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Extract version tag ───────────────────────────────────────────────
      - name: Set image tag
        id: tag
        run: echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      # ── 3. Set up QEMU + buildx for multi-arch ───────────────────────────────
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 4. Login to Docker Hub ───────────────────────────────────────────────
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # ── 5. Build image locally for scanning (single arch, no push yet) ────────
      - name: Build image for scan
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:scan

      # ── 6. Security scan with Trivy ───────────────────────────────────────────
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:scan
          format: table
          exit-code: '1'
          severity: CRITICAL
          ignore-unfixed: true

      # ── 7. Build & push multi-arch image ─────────────────────────────────────
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          no-cache: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.VERSION }}
            ${{ env.IMAGE_NAME }}:latest

      # ── 8. Deploy to VPS via SSH ──────────────────────────────────────────────
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          script: |
            helm upgrade ${{ env.HELM_RELEASE }} ${{ env.HELM_CHART_PATH }} \
              --namespace ${{ env.HELM_NAMESPACE }} \
              --set ${{ env.HELM_IMAGE_KEY }}=${{ steps.tag.outputs.VERSION }} \
              --reuse-values

      # ── 9. Post-deploy health check ───────────────────────────────────────────
      - name: Wait for rollout
        run: sleep 30

      - name: Health check
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 ${{ env.HEALTH_URL }})
          echo "Health check status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "❌ Health check failed — site returned HTTP $STATUS"
            exit 1
          fi
          echo "✅ Health check passed"

      # ── 10. Summary ───────────────────────────────────────────────────────────
      - name: Summary
        run: |
          echo "### ✅ Deployed ${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Namespace | \`${{ env.HELM_NAMESPACE }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.VERSION }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Health | ✅ |" >> $GITHUB_STEP_SUMMARY
